<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiyoy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Antiyoy</h2>
<div id="info-panel"></div>

<div id="movment">
    <button onclick="login()">Join</button>
    <button onclick="start()">Start</button>
    <button onclick="endTurn()">End Turn</button>
    <button onclick="surrender()">Surrender</button>
</div>

<div class="units">
    <button onclick="selectedHex='BUY_PEASANT'">Peasant (10)</button>
    <button onclick="selectedHex='BUY_SPEARMAN'">Spearman (20)</button>
    <button onclick="selectedHex='BUY_KNIGHT'">Knight (40)</button>
    <button onclick="selectedHex='BUY_FARM'">Farm (12)</button>
    <button onclick="selectedHex='BUY_TOWER'">Tower (15)</button>
    <button onclick="selectedHex='BUY_FORTRESS'">Fortress (35)</button>
</div>

<div id="map"></div>

<script src="script.js"></script>
</body>
</html>
